


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Waiting for Rebecca ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Ensures it covers the whole screen on mobile */
            min-height: -webkit-fill-available; 
            margin: 0;
            padding: 20px;
            background-color: #ffe4e6; 
            background-image: linear-gradient(to top right, #ffdde1 0%, #ee9ca7 100%);
            color: #4a4a4a;
            overflow: hidden;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.4);
            text-align: center;
            width: 100%;
            max-width: 450px;
            /* Extra blur effect for a modern iOS feel */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        h1 {
            color: #e84393;
            font-size: 2.4rem;
            margin-top: 0;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .flight-info {
            font-size: 1.05rem;
            color: #636e72;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .timer {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .time-box {
            background: #ff7675;
            color: white;
            padding: 15px 10px;
            border-radius: 18px;
            min-width: 75px;
            flex: 1;
            box-shadow: 0 8px 15px rgba(255, 118, 117, 0.3);
            transition: transform 0.2s;
        }

        .time-box:active {
            transform: scale(0.95);
        }

        .time-box span {
            display: block;
            font-size: 2.2rem;
            font-weight: 600;
        }

        .time-box .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            font-weight: 400;
            opacity: 0.9;
        }

        .emoji-plane {
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(15deg); }
            50% { transform: translateY(-12px) rotate(15deg); }
            100% { transform: translateY(0px) rotate(15deg); }
        }

        .message {
            margin-top: 15px;
            font-size: 1.6rem;
            font-weight: 600;
            color: #e84393;
            display: none; 
            line-height: 1.3;
        }

        /* Responsive styling for iPhone screens */
        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
                border-radius: 25px;
            }
            h1 {
                font-size: 2.1rem;
            }
            .timer {
                /* Snaps the timer into a 2x2 grid so numbers stay big */
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .time-box {
                padding: 20px 10px;
            }
            .time-box span {
                font-size: 2.4rem;
            }
            .emoji-plane {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="emoji-plane">✈️💕</div>
    <h1>Waiting for Rebecca</h1>
    <div class="flight-info" id="flight-info">
        <strong>Aer Lingus 462 (DUB to CTA)</strong><br>
        Landing June 10th at 7:05 PM
    </div>
    
    <div class="timer" id="timer">
        <div class="time-box">
            <span id="days">00</span>
            <div class="label">Days</div>
        </div>
        <div class="time-box">
            <span id="hours">00</span>
            <div class="label">Hours</div>
        </div>
        <div class="time-box">
            <span id="minutes">00</span>
            <div class="label">Mins</div>
        </div>
        <div class="time-box">
            <span id="seconds">00</span>
            <div class="label">Secs</div>
        </div>
    </div>
    
    <div class="message" id="message">She's here!<br>Welcome to Catania! 🍋❤️</div>
</div>

<script>
    // Target: June 10, 2026 at 7:05 PM (19:05:00)
    const countDownDate = new Date("June 10, 2026 19:05:00").getTime();

    const countdownFunction = setInterval(function() {
        const now = new Date().getTime();
        const distance = countDownDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days.toString().padStart(2, '0');
        document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
        document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
        document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');

        if (distance < 0) {
            clearInterval(countdownFunction);
            document.getElementById("timer").style.display = "none";
            document.getElementById("flight-info").style.display = "none";
            document.getElementById("message").style.display = "block";
        }
    }, 1000);
</script>

</body>
</html>
